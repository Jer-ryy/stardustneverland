services:
  - type: web
    name: stardustneverland
    runtime: node
    plan: free
    autoDeployTrigger: off # deploys are triggered by the GitHub Actions workflow
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DB_URL
        sync: false
      - key: JWTKey
        generateValue: true
      - key: DB_CONNECTION_LIMIT
        value: 5
